name: Automation Framework Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 9 * * *'  # Daily at 9 AM UTC

jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Display environment info
        run: |
          echo "GitHub Workflow Run: ${{ github.run_id }}"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
          echo "Actor: ${{ github.actor }}"

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: Install dependencies
        run: npm ci
        continue-on-error: true
      
      - name: Run build
        run: npm run build
        continue-on-error: true
      
      - name: Run tests
        run: npm test
        continue-on-error: true

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      
      - name: Run linting
        run: npm run lint
        continue-on-error: true
      
      - name: Check code coverage
        run: npm run coverage
        continue-on-error: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      
      - name: Run npm audit
        run: npm audit
        continue-on-error: true
      
      - name: OWASP Dependency Check
        uses: jeremylong/DependencyCheck_Action@main
        with:
          project: 'Automation-Framework'
          path: '.'
          format: 'JSON'
          continue-on-error: true

  notify:
    name: Notify on Completion
    runs-on: ubuntu-latest
    needs: [build, code-quality, security]
    if: always()
    steps:
      - name: Pipeline Status
        run: |
          echo "Pipeline Status: ${{ job.status }}"
          echo "Build Status: ${{ needs.build.result }}"
          echo "Code Quality Status: ${{ needs.code-quality.result }}"
          echo "Security Status: ${{ needs.security.result }}"
